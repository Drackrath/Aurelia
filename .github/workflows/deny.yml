name: cargo-deny

# Licences, bans and sources on every change; advisories also weekly.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    # New advisories shouldn't block unrelated PRs.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
