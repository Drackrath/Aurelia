name: Aurelia Release

# Build release binaries for every target on a native runner (no cross-compiling)
# and attach them to a GitHub Release. Asset names follow the wiki's Releasing page
# (https://github.com/Drackrath/Aurelia/wiki/Releasing) (the names
# Heroic's downloader expects): aurelia_<os>_<arch>[.exe]. The Linux jobs also
# build and attach a Debian package (.deb) for standalone `apt`/`dpkg` installs.
#
# Triggers on a pushed v* tag (creates the release); workflow_dispatch just
# builds the artifacts so you can test the matrix without tagging.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            asset: aurelia_linux_x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset: aurelia_linux_arm64
          - name: windows-x86_64
            os: windows-latest
            asset: aurelia_windows_x86_64.exe
          - name: windows-arm64
            os: windows-11-arm
            asset: aurelia_windows_arm64.exe
          - name: macos-x86_64
            os: macos-15-intel
            asset: aurelia_macOS_x86_64
          - name: macos-arm64
            os: macos-14
            asset: aurelia_macOS_arm64
          - name: nix-flake
            os: ubuntu-24.04
            builder: nix

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && matrix.builder != 'nix'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libgtk-3-dev \
            libpulse-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev

      # Headless Wine Steam wrapper needs mingw.
      - name: Install CEF wrapper cross toolchain (Linux x86_64)
        if: matrix.name == 'linux-x86_64'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Rust toolchain
        if: matrix.builder != 'nix'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'linux-x86_64' && 'x86_64-pc-windows-gnu' || '' }}

      - name: Build Aurelia (release)
        if: matrix.builder != 'nix'
        run: cargo build --release

      # Fail if the wrapper went missing.
      - name: Check embedded CEF wrapper (Linux x86_64)
        if: matrix.name == 'linux-x86_64'
        run: ls target/release/build/aurelia-*/out/cef-wrapper.exe

      - name: Install Nix
        if: matrix.builder == 'nix'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build Aurelia (nix flake)
        if: matrix.builder == 'nix'
        run: nix build --print-build-logs .#aurelia
      - name: Smoke-test the flake build
        if: matrix.builder == 'nix'
        run: ./result/bin/aurelia --version

      - name: Stage binary as release asset
        if: matrix.builder != 'nix'
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/release/aurelia.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/release/aurelia" "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
          fi

      # Build a Debian package for standalone `apt`/`dpkg` installs (independent of
      # Heroic, which fetches the raw binary above). cargo-deb auto-detects the
      # runner's architecture, so the x86_64 and arm64 Linux jobs each emit their
      # own .deb. `--no-build` reuses the binary built in the previous step.
      - name: Build .deb package (Linux)
        if: runner.os == 'Linux' && matrix.builder != 'nix'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build

      # Upload this target's binary straight to the GitHub Release with `gh`
      # (no upload/download-artifact round-trip — that proved unreliable in this
      # runner setup). The first job to finish creates the release; the rest
      # attach their asset to it. Only runs for an actual tag; workflow_dispatch
      # just builds.
      - name: Publish asset to release
        if: startsWith(github.ref, 'refs/tags/') && matrix.builder != 'nix'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/${{ matrix.asset }}"
          # rc/beta/alpha/pre/experimental tags: prereleases.
          # Hotfixes like v0.1.37-2 stay releases.
          pre=()
          case "$GITHUB_REF_NAME" in
            *-rc*|*-beta*|*-alpha*|*-pre*|*-experimental*) pre=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aurelia $GITHUB_REF_NAME" \
            --generate-notes "${pre[@]}" 2>/dev/null \
          || gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

      # Attach the .deb (built above) to the same release. Runs after the step
      # above, so the release is guaranteed to exist by now. cargo-deb names it
      # aurelia_<version>_<arch>.deb under target/debian/.
      - name: Publish .deb to release (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/') && matrix.builder != 'nix'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=$(ls target/debian/*.deb | head -n1)
          gh release upload "$GITHUB_REF_NAME" "$deb" --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: Generate release checksums
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          rm -f release-assets/SHA256SUMS
          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%f\0' \
              | sort -z \
              | while IFS= read -r -d '' asset; do
                  sha256sum -- "$asset"
                done
          ) > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS
        shell: bash
        run: |
          cosign sign-blob SHA256SUMS \
            --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem
          test -s SHA256SUMS.sig
          test -s SHA256SUMS.pem

      - name: Publish checksums and signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            SHA256SUMS \
            SHA256SUMS.sig \
            SHA256SUMS.pem \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
