[graph]
all-features = true

[licenses]
# Compatible with GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# aws-lc-sys bundles OpenSSL-licensed code.
exceptions = [{ allow = ["OpenSSL"], crate = "aws-lc-sys" }]

[advisories]
# Each ignore names why it can't be reached.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
