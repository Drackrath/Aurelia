[package]
name = "aurelia-steam"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
description = "Aurelia CLI Steam launcher"
license = "GPL-3.0-or-later"
repository = "https://github.com/Drackrath/Aurelia"
exclude = [".github/", "scripts/", "flake.nix", "flake.lock"]

# Crate name "aurelia" is taken.
[lib]
name = "aurelia"
path = "src/lib.rs"

[[bin]]
name = "aurelia"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6" # Match steam-vent's directories version so only one copy is linked
rpassword = "7"
keyvalues-serde = "0.2" # Used for text VDF deserialization into structs
protobuf = "3.7.2" # rust-protobuf runtime; matches steam-vent-proto's MessageField/EnumOrUnknown so we can build StoreBrowse requests
rand = "0.10" # Match steam-vent's rand version so only one copy is linked
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steam-vdf-parser = "0.1.1" # Needed for raw binary PICS VDF parsing (not supported by keyvalues-serde or steam-vent yet)
steam-vent = { package = "aurelia-steam-vent", version = "0.8.0" } # Fork with per-session logon IDs
steam-vent-proto = { package = "aurelia-steam-vent-proto", version = "0.6.1" } # proto is no longer re-exported as steam_vent::proto since 0.5; depend on it directly
steam-vent-proto-common = { package = "aurelia-steam-vent-proto-common", version = "0.6.1" } # RpcMethod/RpcMessage traits, to hand-wire the CloudConfigStore RPC (library collections) not shipped in steam-vent-proto
steam-vent-chat = { package = "aurelia-steam-vent-chat", version = "0.9.0" } # Fork on aurelia-steam-vent 0.8
steamid-ng = "3" # Construct SteamIDs (from u64 / string) to pass to steam-vent-chat; matches steam-vent's steamid-ng
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "net", "io-util", "sync", "io-std", "process"] }
tokio-stream = "0.1" # Consume steam-vent's notification broadcast streams (friend chat events)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] } # Deflate only: Steam zips nothing else.
tar = "0.4" # Extract downloaded Proton/Wine-GE runtime tarballs (.tar.gz/.tar.xz)
hex = "0.4"
sha1 = "0.10"
flate2 = "1"
xz2 = "0.1"
cbc = "0.1"
aes = "0.8"
steam-cdn = { package = "aurelia-steam-cdn", version = "4.1.0" } # Fork on aurelia-steam-vent 0.8
libc = "0.2"
regex = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] } # Enumerate/kill aurelia processes for `kill`/`daemon`; `disk` for library free-space checks
qrcode = { version = "0.14", default-features = false } # Terminal QR rendering for `login --qr`
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1" # Wipe secrets on drop
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }

[build-dependencies]
# Pure-Rust protobuf codegen (no protoc) for the CloudConfigStore messages used by
# library collections; version tracks the `protobuf` runtime above.
protobuf-codegen = "3.7.2"

[target.'cfg(windows)'.dependencies]
# Used to stop the detached daemon from inheriting the spawning process's stdio
# handles (otherwise a parent like Heroic never sees EOF and hangs).
# Shell/Registry/Threading/WindowsAndMessaging: UAC-elevated game launch.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"      # optimize for size
lto = "thin"          # whole-program inlining + cross-crate dead-code elimination
codegen-units = 1    # better cross-module optimization (slower compile)
panic = "abort"      # drop unwinding tables & landing pads
strip = "symbols"    # strip symbol/debug info from the binary

[dev-dependencies]
tempfile = "3"
http = "1" # Build reqwest responses offline in tests

[package.metadata.deb]
name = "aurelia"
maintainer = "Aurelia Contributors"
copyright = "2026, Aurelia Contributors"
license-file = "LICENSE"
section = "games"
priority = "optional"
depends = "$auto, libssl3"
assets = [
    ["target/release/aurelia", "usr/bin/aurelia", "755"],
]
